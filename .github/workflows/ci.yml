name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run generate
        env:
          # The automatic token only raises the GitHub API rate limit
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs typegen + tsc, eslint and prettier in sequence
      - run: bun run check
